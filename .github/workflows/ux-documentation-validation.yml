name: UX flow documentation checks

on:
  pull_request:
    paths:
      - "docs/ux/**"
      - "tests/documentation/validate_ux_flows.py"
      - ".github/workflows/ux-documentation-validation.yml"
  push:
    branches: [main]
    paths:
      - "docs/ux/**"
      - "tests/documentation/validate_ux_flows.py"
      - ".github/workflows/ux-documentation-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-ux-flows:
    name: Validate UX flows and wireframes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Print Python version
        run: python3 --version
      - name: Validate sitemap, scenarios, links, accessibility and states
        run: python3 tests/documentation/validate_ux_flows.py
